name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The daemon spawns child processes and binds loopback ports; both differ enough on Windows
    # to be worth running, and it is the platform this is developed on.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20.11, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
