# The live gateway config. Secrets never live here: ${VAR} reads them from the environment.
version: 1

listen:
  host: 127.0.0.1        # non-loopback would require `token` (NFR-2)
  port: 8420

servers:
  # Figma refuses dynamic client registration, so it needs an OAuth app you create by hand at
  # https://www.figma.com/developers/apps with redirect URI http://127.0.0.1:8419/callback.
  # Set FIGMA_CLIENT_ID and FIGMA_CLIENT_SECRET, then run: mcpgw auth figma
  figma:
    transport: http
    url: https://mcp.figma.com/mcp
    auth: oauth
    scope: "mcp:connect"
    # Uncomment once the app exists and the two variables are set, then: mcpgw auth figma
    # client_id: ${FIGMA_CLIENT_ID}
    # client_secret: ${FIGMA_CLIENT_SECRET}

profiles:
  # Everything, for the editor.
  default:
    servers: ["*"]

  # A narrower view for clients you want to keep out of trouble. Fill the allow list in once
  # `mcpgw list` has shown you the real tool names:
  #   readonly:
  #     servers: [figma]
  #     allow: ["figma__get_*"]

guard:
  pin_tools: true
  on_drift: block
  max_result_bytes: 262144
  redact:
    # Single-quoted, so YAML leaves the backslashes to the regex engine.
    - 'gh[pousr]_[A-Za-z0-9]{16,}'
    - 'sk-[A-Za-z0-9]{20,}'
    - 'figd_[A-Za-z0-9_-]{20,}'
    - '(?i)bearer\s+[A-Za-z0-9._~+/-]{20,}'

audit:
  dir: ./audit
  log_args: hashed
  log_results: none
